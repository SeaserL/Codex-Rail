name: Draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: ./test.ps1
      - shell: pwsh
        run: ./tools/package-release.ps1 -Version ('${{ github.ref_name }}'.Substring(1))
      - name: Create draft for review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' ./dist/*.zip --draft --title 'Codex Rail ${{ github.ref_name }}' --notes-file docs/RELEASE.md
